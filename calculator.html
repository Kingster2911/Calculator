<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>

  <style>
    :root {
      --page: #e9eef5;
      --body: #f8f9fb;
      --key: #ffffff;
      --key-border: #d9dee7;
      --ink: #1f2430;
      --muted: #6b7385;
      --blue: #1a73e8;
      --blue-soft: #e3edfd;
      --red: #d93025;
      --key-hover: #eef1f6;
      --blue-soft-hover: #d3e3fb;
      --blue-hover: #1765cc;
      --on-blue: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }

    .calculator {
      background: var(--body);
      border: 1px solid var(--key-border);
      border-radius: 20px;
      padding: 18px;
    }

    .calculator { width: 340px; }

    .display {
      text-align: right;
      padding: 8px 6px 14px;
      min-height: 96px;
    }
    #previous { color: var(--muted); font-size: 0.95rem; min-height: 1.3em; }
    #current  {
      font-size: 2.4rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .hidden { display: none !important; }

    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    .keys button {
      height: 62px;
      border: 1px solid var(--key-border);
      border-radius: 14px;
      background: var(--key);
      color: var(--ink);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .keys button:hover  { background: var(--key-hover); }
    .keys button:active { transform: scale(0.97); }

    .keys .op     { background: var(--blue-soft); color: var(--blue); border-color: transparent; font-weight: 600; }
    .keys .op:hover { background: var(--blue-soft-hover); }
    .keys .clear  { color: var(--red); font-weight: 600; }
    .keys .equals { background: var(--blue); color: var(--on-blue); border-color: transparent; grid-row: span 2; height: auto; }
    .keys .equals:hover { background: var(--blue-hover); }
    .keys .zero   { grid-column: span 2; }

    button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  </style>
</head>

<body>
  <main class="app">

    <section class="calculator">
</div>

      <div class="display">
        <div id="previous"></div>
        <div id="current">0</div>
      </div>

      <div class="keys">
        <button class="clear" data-key="C">C</button>
        <button class="clear" data-key="back">⌫</button>
        <button class="op" data-key="÷">÷</button>
        <button class="op" data-key="×">×</button>

        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="op" data-key="-">−</button>

        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button class="op" data-key="+">+</button>

        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button class="equals" data-key="=">=</button>

        <button class="zero" data-key="0">0</button>
        <button data-key=".">.</button>
      </div>
    </section>
</main>

  <script>
    const currentEl  = document.getElementById('current');
    const previousEl = document.getElementById('previous');

    const operators = ['+', '-', '×', '÷'];

    let expression = '';
    let justCalculated = false;

    function render() {
      currentEl.textContent = expression || '0';
      currentEl.style.fontSize = expression.length > 14 ? '1.5rem' : '2.4rem';
    }

    function press(key) {
      const last = expression.slice(-1);

      if (operators.includes(key)) {
        if (expression === '') {
          if (key === '-') expression = '-';
        } else if (expression !== '-') {
          if (operators.includes(last)) {
            expression = expression.slice(0, -1) + key;
          } else {
            expression += key;
          }
          justCalculated = false;
        }
      } else {
        if (justCalculated) {
          expression = '';
          previousEl.textContent = '';
          justCalculated = false;
        }
        if (key === '.') {
          const lastNumber = expression.split(/[+\-×÷]/).pop();
          if (lastNumber.includes('.')) return;
          if (lastNumber === '') key = '0.';
        }
        expression += key;
      }
      render();
    }

    function backspace() {
      expression = expression.slice(0, -1);
      justCalculated = false;
      render();
    }

    function clearAll() {
      expression = '';
      previousEl.textContent = '';
      justCalculated = false;
      render();
    }

    function calculate(expr) {
      const tokens = expr.match(/\d+\.?\d*|[+\-×÷]/g);

      if (tokens[0] === '-') {
        tokens.shift();
        tokens[0] = '-' + tokens[0];
      }

      const numbers = [Number(tokens[0])];
      const pending = [];
      for (let i = 1; i < tokens.length; i += 2) {
        const op = tokens[i];
        const num = Number(tokens[i + 1]);
        const lastIndex = numbers.length - 1;

        if (op === '×') {
          numbers[lastIndex] *= num;
        } else if (op === '÷') {
          if (num === 0) return null;
          numbers[lastIndex] /= num;
        } else {
          pending.push(op);
          numbers.push(num);
        }
      }

      let result = numbers[0];
      pending.forEach((op, i) => {
        result += (op === '+') ? numbers[i + 1] : -numbers[i + 1];
      });

      return Math.round(result * 1e10) / 1e10;
    }

    function equals() {
      let expr = expression;
      if (operators.includes(expr.slice(-1))) expr = expr.slice(0, -1);
      if (!/[+\-×÷]/.test(expr.slice(1))) return;

      const result = calculate(expr);

      if (result === null) {
        expression = '';
        render();
        previousEl.textContent = "Can't divide by 0";
        return;
      }

      previousEl.textContent = expr + ' =';
      expression = String(result);
      justCalculated = true;
      render();
    }

    document.querySelectorAll('.keys button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const key = btn.dataset.key;
        if (key === 'C') clearAll();
        else if (key === 'back') backspace();
        else if (key === '=') equals();
        else press(key);
      });
    });

    document.addEventListener('keydown', function (e) {
      if (/^[0-9.]$/.test(e.key) || e.key === '+' || e.key === '-') press(e.key);
      else if (e.key === '*') press('×');
      else if (e.key === '/') { e.preventDefault(); press('÷'); }
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearAll();
    });

    render();
  </script>
</body>
</html>
